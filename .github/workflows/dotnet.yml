name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  # Allow this workflow to be called as a reusable workflow
  workflow_call: {}

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: Ecommercedb

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=Ecommercedb;User=root;Password=root;"

      Jwt__Key: "CI_TEST_JWT_SECRET_KEY_12345678901234567890123456789012345678901234567890"
      Jwt__Issuer: "ECommerceAPI"
      Jwt__Audience: "ECommerceClient"

    steps:

      # ------------------------------------------
      # Checkout
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------
      # .NET
      # ------------------------------------------

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"


      # ------------------------------------------
      # Restore
      # ------------------------------------------

      - name: Restore dependencies
        run: dotnet restore ECommerceSolution.slnx


      # ------------------------------------------
      # Build
      # ------------------------------------------

      - name: Build solution
        run: dotnet build ECommerceSolution.slnx --configuration Release --no-restore


      # ------------------------------------------
      # MySQL Client
      # ------------------------------------------

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client


      # ------------------------------------------
      # Wait for MySQL
      # ------------------------------------------

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; then
              echo "MySQL is ready."
              break
            fi

            echo "Waiting for MySQL..."
            sleep 2
          done


      # ------------------------------------------
      # Install EF Core CLI
      # ------------------------------------------

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.11
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"


      # ------------------------------------------
      # Verify EF CLI
      # ------------------------------------------

      - name: Verify EF Core CLI
        run: dotnet ef --version


      # ------------------------------------------
      # Database migrations
      # ------------------------------------------

      - name: Run EF migrations
        run: |
          dotnet ef database update \
            --project ECommerce.Infrastructure \
            --startup-project ECommerce.API


      - name: Seed CI catalog data
        run: |
         mysql \
          -h 127.0.0.1 \
          -P 3306 \
          -u root \
          -proot \
          Ecommercedb \
          -e "
            INSERT INTO Categories
             (Id, Name, Description, IsActive, CreatedAt)
            VALUES
             (1, 'Test Category', 'CI test category', 1, UTC_TIMESTAMP())
            ON DUPLICATE KEY UPDATE
             Name = VALUES(Name),
             Description = VALUES(Description),
             IsActive = VALUES(IsActive);

            INSERT INTO Products
             (Id, Name, Description, Price, Stock, ImageUrl, IsActive, CreatedAt, CategoryId)
            VALUES
             (1, 'Test Product', 'CI test product', 1000.00, 100, '', 1, UTC_TIMESTAMP(), 1)
            ON DUPLICATE KEY UPDATE
             Name = VALUES(Name),
             Description = VALUES(Description),
             Price = VALUES(Price),
             Stock = VALUES(Stock),
             ImageUrl = VALUES(ImageUrl),
             IsActive = VALUES(IsActive),
             CategoryId = VALUES(CategoryId);
         "



      # ------------------------------------------
      # Tests
      # ------------------------------------------

      - name: Run tests
        run: dotnet test ECommerceSolution.slnx --configuration Release --no-build