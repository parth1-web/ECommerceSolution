
name: .NET Build and Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # Setup .NET
      # ----------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      # ----------------------------------------
      # Restore dependencies
      # ----------------------------------------
      - name: Restore dependencies
        run: dotnet restore ECommerceSolution.slnx


      # ----------------------------------------
      # Build solution
      # ----------------------------------------
      - name: Build solution
        run: dotnet build ECommerceSolution.slnx --configuration Release --no-restore


      # ----------------------------------------
      # Run tests
      # ----------------------------------------
      - name: Run tests
        run: dotnet test ECommerceSolution.slnx --configuration Release --no-build
